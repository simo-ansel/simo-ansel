<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Simone Anselmi — Software Developer</title>
  <desc id="desc">Banner with name and role, next to a terminal window running HardServer and LogMonitor.</desc>

  <defs>
    <!-- Alone verde in alto a sinistra, stesso accento del portfolio -->
    <radialGradient id="glow" cx="0.12" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#3F8F73" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3F8F73" stop-opacity="0"/>
    </radialGradient>

    <!-- Griglia di punti, solo decorativa -->
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#2C2D31"/>
    </pattern>

    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotsMask">
      <rect width="1200" height="320" fill="url(#fade)"/>
    </mask>

    <clipPath id="card">
      <rect width="1200" height="320" rx="16"/>
    </clipPath>

    <style>
      /* Le righe partono visibili e l'animazione le fa comparire da invisibili:
         se un visualizzatore non supporta le animazioni, il testo resta leggibile. */
      .line   { animation: appear .45s ease-out backwards; }
      .l1 { animation-delay: .3s }  .l2 { animation-delay: .9s }
      .l3 { animation-delay: 1.3s } .l4 { animation-delay: 2.1s }
      .l5 { animation-delay: 2.7s } .l6 { animation-delay: 3.3s }
      .cursor { animation: blink 1.1s step-end infinite 3.3s; }

      @keyframes appear { from { opacity: 0; transform: translateY(4px); } }
      @keyframes blink  { 50% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        .line, .cursor { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#0F0F10"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect width="1200" height="320" fill="url(#dots)" mask="url(#dotsMask)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none" stroke="#2C2D31"/>

  <!-- ============ Colonna sinistra ============ -->
  <g transform="translate(64 0)">
    <text x="0" y="92" font-family="ui-monospace, &quot;SF Mono&quot;, &quot;Cascadia Code&quot;, &quot;JetBrains Mono&quot;, Menlo, Consolas, monospace" font-size="15" fill="#59B394" letter-spacing="1.5">~/simo-ansel</text>

    <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#F5F5F5" letter-spacing="-1">Simone Anselmi</text>

    <text x="0" y="190" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="25" fill="#D1D5DB">Software Developer</text>

    <text x="0" y="226" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#9CA3AF">Computer Science student · University of Parma</text>

    <rect x="0" y="250" width="56" height="3" rx="1.5" fill="#3F8F73"/>

    <text x="0" y="282" font-family="ui-monospace, &quot;SF Mono&quot;, &quot;Cascadia Code&quot;, &quot;JetBrains Mono&quot;, Menlo, Consolas, monospace" font-size="14" fill="#6B7280">
      <tspan fill="#59B394">backend</tspan><tspan>  ·  </tspan><tspan fill="#59B394">desktop</tspan><tspan>  ·  </tspan><tspan fill="#59B394">systems</tspan><tspan>  ·  </tspan><tspan fill="#59B394">data</tspan>
    </text>
  </g>

  <!-- ============ Finestra del terminale ============ -->
  <g transform="translate(652 46)">
    <rect width="492" height="228" rx="10" fill="#16171A" stroke="#2C2D31"/>
    <path d="M0 10 a10 10 0 0 1 10 -10 h472 a10 10 0 0 1 10 10 v24 h-492 z" fill="#1C1D21"/>
    <line x1="0" y1="34" x2="492" y2="34" stroke="#2C2D31"/>

    <circle cx="20" cy="17" r="5.5" fill="#4B4C52"/>
    <circle cx="38" cy="17" r="5.5" fill="#4B4C52"/>
    <circle cx="56" cy="17" r="5.5" fill="#4B4C52"/>
    <text x="246" y="21.5" font-family="ui-monospace, &quot;SF Mono&quot;, &quot;Cascadia Code&quot;, &quot;JetBrains Mono&quot;, Menlo, Consolas, monospace" font-size="12" fill="#6B7280" text-anchor="middle">bash — ~/projects</text>

    <g font-family="ui-monospace, &quot;SF Mono&quot;, &quot;Cascadia Code&quot;, &quot;JetBrains Mono&quot;, Menlo, Consolas, monospace" font-size="15">
      <text x="22" y="68" class="line l1"><tspan fill="#59B394">$</tspan><tspan fill="#E5E7EB"> sudo ./hardserver.sh --audit</tspan></text>
      <text x="22" y="94" class="line l2"><tspan fill="#59B394">  ✓</tspan><tspan fill="#9CA3AF"> root login disabled</tspan></text>
      <text x="22" y="120" class="line l3"><tspan fill="#59B394">  ✓</tspan><tspan fill="#9CA3AF"> firewall active · fail2ban on</tspan></text>
      <text x="22" y="154" class="line l4"><tspan fill="#59B394">$</tspan><tspan fill="#E5E7EB"> ./logmon.sh --report</tspan></text>
      <text x="22" y="180" class="line l5"><tspan fill="#59B394">  →</tspan><tspan fill="#9CA3AF"> report sent · 13 sources scanned</tspan></text>
      <text x="22" y="212" class="line l6"><tspan fill="#59B394">$</tspan></text>
    </g>
    <rect x="40" y="199" width="9" height="17" fill="#59B394" class="cursor"/>
  </g>
</svg>
